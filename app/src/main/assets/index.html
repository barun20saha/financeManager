<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"/>
  <title>Red Orbit - My Accounts</title>

  <!-- PWA & Mobile Meta Tags -->
  <meta name="mobile-web-app-capable" content="yes"/>
  <meta name="apple-mobile-web-app-capable" content="yes"/>
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"/>
  <meta name="apple-mobile-web-app-title" content="Red Orbit"/>
  <meta name="theme-color" content="#065f46"/>
  <meta name="description" content="Red Orbit - Customer, Supplier Ledger & Trip Expense Tracker"/>

  <!-- External Dependencies -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/bson/dist/bson.browser.umd.js"></script>
  <script>
    // Filter out Babel warning noise in WebView console
    const _warn = console.warn;
    console.warn = (...args) => {
      if (args[0] && typeof args[0] === 'string' && args[0].includes('Babel')) return;
      _warn.apply(console, args);
    };
  </script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.2/babel.min.js"></script>

  <!-- Modular Stylesheet -->
  <link rel="stylesheet" href="./style.css"/>
</head>
<body>

  <!-- React Mount Point -->
  <div id="root"></div>

  <!-- Modular Application Logic -->
  <script type="text/babel" src="./app.js"></script>

</body>
</html>
