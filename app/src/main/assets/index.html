// 5. SECURITY & ENCRYPTED BACKUP
// ══════════════════════════════════════════════════════════════

function SecurityView({ db, save, logAction, onTriggerBackupModal }) {
  const settings = db.settings || INIT.settings;

  const toggleAppLock = () => {
    const next = { ...db, settings: { ...settings, appLockEnabled: !settings.appLockEnabled } };
    save(next);
    logAction("Security Changed", `App Lock ${!settings.appLockEnabled ? "Enabled" : "Disabled"}`);
  };

  const toggleBiometrics = () => {
    if (window.AndroidBridge && window.AndroidBridge.authenticateBiometric) {
      window.onBiometricResult = (success, msg) => {
        if (success) {
          const next = { ...db, settings: { ...settings, biometricsEnabled: !settings.biometricsEnabled } };
          save(next);
          logAction("Biometrics Changed", `Biometrics ${!settings.biometricsEnabled ? "Enabled" : "Disabled"}`);
        } else {
          alert("Biometric verification failed: " + msg);
        }
      };
      window.AndroidBridge.authenticateBiometric();
    } else {
      alert("Biometrics not supported on this device/environment.");
    }
  };

  return (
    <div style={{display:"flex",flexDirection:"column",height:"100vh",background:"#f7f8fa"}}>
      <div style={{background:NAVY,color:"#fff",paddingTop:"calc(12px + env(safe-area-inset-top, 24px))",paddingLeft:16,paddingRight:16,paddingBottom:16}}>
        <div style={{fontSize:20,fontWeight:900,letterSpacing:"0.5px"}}>SECURITY & BACKUP</div>
        <div style={{fontSize:12,color:"rgba(255,255,255,0.8)",marginTop:2}}>Protection, device biometrics, and encrypted backup</div>
      </div>

      <div style={{flex:1,overflowY:"auto",padding:16,paddingBottom:90}}>
        <div className="card">
          <div style={{display:"flex",justifyContent:"space-between",alignItems:"center"}}>
            <div>
              <div style={{fontWeight:800,fontSize:15}}>App Lock</div>
              <div style={{fontSize:12,color:"#757575"}}>Require authentication to open Fire Ball</div>
            </div>
            <div className={`toggle-switch ${settings.appLockEnabled ? 'on' : ''}`} onClick={toggleAppLock}/>
          </div>
        </div>

        <div className="card">
          <div style={{display:"flex",justifyContent:"space-between",alignItems:"center"}}>
            <div>
              <div style={{fontWeight:800,fontSize:15}}>Fingerprint / Face ID</div>
              <div style={{fontSize:12,color:"#757575"}}>Use device biometrics to unlock</div>
            </div>
            <div className={`toggle-switch ${settings.biometricsEnabled ? 'on' : ''}`} onClick={toggleBiometrics}/>
          </div>
        </div>

        <div style={{marginTop:24,fontSize:13,fontWeight:700,textTransform:"uppercase",color:"#757575",letterSpacing:"0.06em",marginBottom:10}}>
          Encrypted Data Backup
        </div>
        <div className="card" onClick={onTriggerBackupModal} style={{cursor:"pointer",display:"flex",alignItems:"center",gap:14,padding:16}}>
          <div style={{fontSize:28}}>🔒</div>
          <div style={{flex:1}}>
            <div style={{fontWeight:800,fontSize:15,color:NAVY}}>Encrypted Backup & Restore</div>
            <div style={{fontSize:12,color:"#757575",marginTop:2}}>
              AES-GCM 256-bit encrypted file backup. Includes customers, suppliers, trips, and logs.
            </div>
          </div>
          <span style={{fontSize:18,color:"#aaa"}}>›</span>
        </div>
      </div>
    </div>
  );
}

// ══════════════════════════════════════════════════════════════
// 6. MAIN APPLICATION SHELL
// ══════════════════════════════════════════════════════════════

function App() {
  const [db, setDB] = useState(loadFromAllSources);
  const [navTab, setNavTab] = useState("accounts"); // accounts, trips, activity, logs, security
  const [homeSubTab, setHomeSubTab] = useState(0); // 0 = customers, 1 = suppliers
  const [openEntityId, setOpenEntityId] = useState(null);
  const [openEntityListKey, setOpenEntityListKey] = useState(null);

  // Delete entries by date modal
  const [showDeleteByDate, setShowDeleteByDate] = useState(false);
  const [deleteFrom, setDeleteFrom] = useState("");
  const [deleteTo, setDeleteTo] = useState("");
  const [deleteConfirm, setDeleteConfirm] = useState(false);
  const [deleteResult, setDeleteResult] = useState("");

  // Encrypted Backup modal
  const [showBackup, setShowBackup] = useState(false);
  const [backupPassword, setBackupPassword] = useState("");
  const [restorePassword, setRestorePassword] = useState("");
  const [showPasswordPrompt, setShowPasswordPrompt] = useState(false);
  const [pendingEncryptedPayload, setPendingEncryptedPayload] = useState(null);
  const [backupErr, setBackupErr] = useState("");
  const [backupOk, setBackupOk] = useState(false);
  const [backupSuccessMsg, setBackupSuccessMsg] = useState("");
  const fileInputRef = useRef(null);

  // Save handler
  const save = useCallback((next) => {
    setDB(next);
    persistAllSources(next);
  }, []);

  const logAction = useCallback((type, detail, status = "success") => {
    const newLog = {
      id: uid(),
      type,
      detail,
      status,
      timestamp: Date.now(),
      device: "Android Device"
    };
    setDB(prev => {
      const next = { ...prev, logs: [newLog, ...(prev.logs || [])] };
      persistAllSources(next);
      return next;
    });
  }, []);

  // ── DELETE BY DATE ──
  function countEntriesByDate() {
    if (!deleteFrom && !deleteTo) return 0;
    let count = 0;
    const from = deleteFrom ? new Date(deleteFrom) : null;
    const to = deleteTo ? new Date(deleteTo) : null;
    Object.values(db.transactions || {}).forEach(txs => {
      txs.forEach(tx => {
        const d = new Date(tx.date);
        if ((!from || d >= from) && (!to || d <= to)) count++;
      });
    });
    return count;
  }

  function deleteEntriesByDate() {
    if (!deleteFrom && !deleteTo) return;
    const from = deleteFrom ? new Date(deleteFrom) : null;
    const to = deleteTo ? new Date(deleteTo) : null;
    let count = 0;
    const newTxs = {};
    Object.entries(db.transactions || {}).forEach(([id, txs]) => {
      newTxs[id] = txs.filter(tx => {
        const d = new Date(tx.date);
        const inRange = (!from || d >= from) && (!to || d <= to);
        if (inRange) count++;
        return !inRange;
      });
    });
    save({ ...db, transactions: newTxs });
    logAction("Entries Deleted", `Deleted ${count} transactions between ${deleteFrom || 'start'} and ${deleteTo || 'end'}`);
    setDeleteResult(`Deleted ${count} entr${count === 1 ? "y" : "ies"} successfully.`);
    setDeleteConfirm(false);
    setDeleteFrom(""); setDeleteTo("");
    setTimeout(() => { setDeleteResult(""); setShowDeleteByDate(false); }, 2000);
  }

  // ── ENCRYPTED BACKUP EXPORT ──
  async function exportEncryptedBackup() {
    try {
      const payload = {
        customers: db.customers || [],
        suppliers: db.suppliers || [],
        transactions: db.transactions || {},
        trips: db.trips || [],
        logs: db.logs || [],
        settings: db.settings || {},
        exportedAt: new Date().toISOString(),
        version: "fireball_v2"
      };

      const password = backupPassword.trim() || "fireball_secure";
      const encryptedStr = await encryptData(payload, password);
      const filename = `fireball-backup-${todayStr()}.json`;

      if (window.AndroidBridge && window.AndroidBridge.saveFile) {
        window.AndroidBridge.saveFile(filename, encryptedStr);
      } else {
        const blob = new Blob([encryptedStr], { type: "application/json" });
        const url = URL.createObjectURL(blob);
        const a = document.createElement("a");
        a.href = url; a.download = filename;
        document.body.appendChild(a); a.click();
        setTimeout(() => { URL.revokeObjectURL(url); document.body.removeChild(a); }, 1000);
      }
      logAction("Backup Exported", `Encrypted backup saved`);
      setBackupSuccessMsg("Encrypted backup saved successfully!");
      setBackupOk(true);
      setTimeout(() => { setBackupOk(false); setShowBackup(false); setBackupPassword(""); }, 2000);
    } catch (e) {
      setBackupErr("Export failed: " + e.message);
    }
  }

  // ── RESTORE BACKUP ──
  function handleFileImport(e) {
    const file = e.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = async ev => {
      try {
        const content = ev.target.result;
        await processRestoreContent(content);
      } catch (err) {
        setBackupErr("Could not read backup file: " + err.message);
      }
    };
    reader.readAsText(file);
    e.target.value = "";
  }

  async function processRestoreContent(content) {
    try {
      const parsed = typeof content === "string" ? JSON.parse(content) : content;
      // Check if it is encrypted (has salt, iv, data)
      if (parsed.salt && parsed.iv && parsed.data) {
        setPendingEncryptedPayload(content);
        setShowPasswordPrompt(true);
        return;
      }
      // Plaintext legacy JSON
      applyRestoredData(parsed);
    } catch (e) {
      setBackupErr("Invalid backup format: " + e.message);
    }
  }

  async function submitDecryptionPassword() {
    try {
      if (!pendingEncryptedPayload) return;
      const decrypted = await decryptData(pendingEncryptedPayload, restorePassword.trim() || "fireball_secure");
      applyRestoredData(decrypted);
      setShowPasswordPrompt(false);
      setPendingEncryptedPayload(null);
      setRestorePassword("");
    } catch (e) {
      setBackupErr("Decryption failed. Please verify password.");
    }
  }

  function applyRestoredData(parsed) {
    if (!parsed || (!parsed.customers && !parsed.trips)) {
      setBackupErr("Invalid backup file structure.");
      return;
    }
    const next = {
      customers: parsed.customers || [],
      suppliers: parsed.suppliers || [],
      transactions: parsed.transactions || {},
      trips: parsed.trips || [],
      logs: parsed.logs || [],
      settings: parsed.settings || db.settings
    };
    save(next);
    logAction("Backup Restored", "Data restored from backup");
    setBackupSuccessMsg("Data restored successfully!");
    setBackupOk(true);
    setBackupErr("");
    setTimeout(() => { setBackupOk(false); setShowBackup(false); }, 1500);
  }

  // Expose global bridge for Android native document picker
  useEffect(() => {
    window.restoreFromAndroid = (data) => {
      processRestoreContent(data);
    };
  }, [save]);

  // Swipe support for Customers/Suppliers
  const swipeStart = useRef(null);
  const [modalOpen, setModalOpen] = useState(false);
  function onTouchStart(e) { if (modalOpen) return; swipeStart.current = e.touches[0].clientX; }
  function onTouchEnd(e) {
    if (modalOpen || swipeStart.current === null) return;
    const diff = swipeStart.current - e.changedTouches[0].clientX;
    if (Math.abs(diff) > 60) setHomeSubTab(diff > 0 ? 1 : 0);
    swipeStart.current = null;
  }

  // If opening customer/supplier ledger
  if (openEntityId && openEntityListKey) {
    return (
      <div style={{maxWidth:480,margin:"0 auto",height:"100vh",background:"#f7f8fa"}}>
        <CustomerSupplierLedger
          db={db} save={save}
          entityId={openEntityId}
          listKey={openEntityListKey}
          accentColor={openEntityListKey === "customers" ? NAVY : TEAL}
          accentLight={openEntityListKey === "customers" ? NAVY_LIGHT : TEAL_LIGHT}
          onBack={() => { setOpenEntityId(null); setOpenEntityListKey(null); }}
          logAction={logAction}
        />
      </div>
    );
  }

  const accent = homeSubTab === 0 ? NAVY : TEAL;

  return (
    <div style={{maxWidth:480,margin:"0 auto",height:"100vh",display:"flex",flexDirection:"column",background:"#f7f8fa",position:"relative"}}>
      {/* ── VIEWS ── */}
      <div style={{flex:1,overflow:"hidden",display:"flex",flexDirection:"column"}}>
        {/* VIEW 1: MY ACCOUNTS (PRIMARY HOME SCREEN) */}
        {navTab === "accounts" && (
          <div onTouchStart={onTouchStart} onTouchEnd={onTouchEnd}
            style={{height:"100%",display:"flex",flexDirection:"column"}}>
            {/* Header */}
            <div style={{background:accent,color:"#fff",paddingTop:"calc(12px + env(safe-area-inset-top, 24px))",paddingLeft:16,paddingRight:16,paddingBottom:0,flexShrink:0}}>
              <div style={{display:"flex",alignItems:"center",marginBottom:14}}>
                <div style={{flex:1,fontSize:20,fontWeight:900,letterSpacing:"0.5px"}}>MY ACCOUNTS</div>
                <button onClick={() => { setShowDeleteByDate(true); setDeleteFrom(""); setDeleteTo(""); setDeleteConfirm(false); setDeleteResult(""); }}
                  style={{background:"rgba(255,255,255,0.18)",border:"none",borderRadius:10,padding:"7px 14px",color:"#fff",fontWeight:700,fontSize:13,cursor:"pointer",marginRight:8}}>
                  Delete
                </button>
                <button onClick={() => { setShowBackup(true); setBackupErr(""); setBackupOk(false); }}
                  style={{background:"rgba(255,255,255,0.18)",border:"none",borderRadius:10,padding:"7px 14px",color:"#fff",fontWeight:700,fontSize:13,cursor:"pointer"}}>
                  ☁ Backup
                </button>
              </div>
              <div style={{display:"flex",gap:4}}>
                {["Customers", "Suppliers"].map((label, i) => (
                  <div key={i} onClick={() => setHomeSubTab(i)}
                    style={{flex:1,textAlign:"center",padding:"10px 0",fontSize:14,fontWeight:700,cursor:"pointer",
                      color: homeSubTab === i ? "#fff" : "rgba(255,255,255,0.55)",
                      borderBottom: homeSubTab === i ? "3px solid #fff" : "3px solid transparent",transition:"all 0.2s"}}>
                    {label}
                  </div>
                ))}
              </div>
            </div>

            {/* Sliding Entity Lists */}
            <div style={{flex:1,overflow:"hidden",position:"relative"}}>
              <div style={{display:"flex",width:"200%",height:"100%",transform:`translateX(${homeSubTab === 0 ? "0%" : "-50%"})`,transition:"transform 0.3s ease"}}>
                <div style={{width:"50%",height:"100%",overflow:"hidden"}}>
                  <EntityList db={db} save={save} tab="customers" accentColor={NAVY} accentLight={NAVY_LIGHT}
                    onOpen={id => { setOpenEntityId(id); setOpenEntityListKey("customers"); }}
                    onModalChange={setModalOpen} logAction={logAction}/>
                </div>
                <div style={{width:"50%",height:"100%",overflow:"hidden"}}>
                  <EntityList db={db} save={save} tab="suppliers" accentColor={TEAL} accentLight={TEAL_LIGHT}
                    onOpen={id => { setOpenEntityId(id); setOpenEntityListKey("suppliers"); }}
                    onModalChange={setModalOpen} logAction={logAction}/>
                </div>
              </div>
            </div>
          </div>
        )}

        {/* VIEW 2: TRIPS (FULL EXPENSE TRACKER) */}
        {navTab === "trips" && <TripsView db={db} save={save} logAction={logAction}/>}

        {/* VIEW 3: LEETCODE-STYLE ACTIVITY CALENDAR */}
        {navTab === "activity" && <ActivityCalendarView db={db}/>}

        {/* VIEW 4: ACTIVITY LOGS */}
        {navTab === "logs" && <ActivityLogsView db={db}/>}

        {/* VIEW 5: SECURITY */}
        {navTab === "security" && (
          <SecurityView db={db} save={save} logAction={logAction} onTriggerBackupModal={() => { setShowBackup(true); setBackupErr(""); setBackupOk(false); }}/>
        )}
      </div>

      {/* ── BOTTOM NAVIGATION BAR ── */}
      <div className="safe-bottom"
        style={{background:"#fff",borderTop:"1px solid #e5e7eb",display:"flex",justifyContent:"space-around",padding:"8px 0",flexShrink:0,zIndex:100,boxShadow:"0 -2px 10px rgba(0,0,0,0.03)"}}>
        {[
          { id: "accounts", label: "Accounts", icon: "📒" },
          { id: "trips", label: "Trips", icon: "✈️" },
          { id: "activity", label: "Activity", icon: "📈" },
          { id: "logs", label: "Logs", icon: "📋" },
          { id: "security", label: "Security", icon: "🔒" }
        ].map(t => {
          const isActive = navTab === t.id;
          return (
            <div key={t.id} onClick={() => setNavTab(t.id)}
              style={{textAlign:"center",cursor:"pointer",flex:1,opacity: isActive ? 1 : 0.6}}>
              <div style={{fontSize:20}}>{t.icon}</div>
              <div style={{fontSize:10,fontWeight:700,marginTop:2,color: isActive ? NAVY : "#6b7280"}}>
                {t.label}
              </div>
            </div>
          );
        })}
      </div>

      {/* ── DELETE BY DATE MODAL ── */}
      <Modal open={showDeleteByDate} onClose={() => { setShowDeleteByDate(false); setDeleteConfirm(false); setDeleteResult(""); }} title="Delete Entries by Date">
        <p style={{fontSize:13,color:"#555",marginBottom:16}}>Remove all transactions within a date range across all customers and suppliers.</p>

        <span style={lbl}>From Date</span>
        <input type="date" value={deleteFrom} onChange={e => { setDeleteFrom(e.target.value); setDeleteConfirm(false); }} style={inp}/>

        <span style={lbl}>To Date</span>
        <input type="date" value={deleteTo} onChange={e => { setDeleteTo(e.target.value); setDeleteConfirm(false); }} style={inp}/>

        {(deleteFrom || deleteTo) && !deleteConfirm && !deleteResult && (() => {
          const count = countEntriesByDate();
          return (
            <div style={{background:"#fff8e1",borderRadius:10,padding:"12px 14px",marginTop:14,fontSize:13,color:"#555"}}>
              <span style={{fontWeight:800,color:"#f57c00"}}>{count} entr{count === 1 ? "y" : "ies"}</span> found in this range.
            </div>
          );
        })()}

        {deleteConfirm && (
          <div style={{background:"#ffebee",borderRadius:10,padding:"12px 14px",marginTop:14,fontSize:13,color:"#c62828",fontWeight:700}}>
            ⚠ This will permanently delete transactions. Are you sure?
          </div>
        )}

        {deleteResult && (
          <div style={{background:GREEN_LIGHT,color:GREEN,borderRadius:10,padding:"12px 14px",marginTop:14,fontSize:13,fontWeight:700}}>
            ✓ {deleteResult}
          </div>
        )}

        {!deleteResult && (
          <div style={{display:"flex",gap:8,marginTop:16}}>
            {!deleteConfirm ? (
              <>
                <button onClick={() => { setShowDeleteByDate(false); setDeleteConfirm(false); }}
                  style={{flex:1,border:"none",borderRadius:10,padding:"13px",fontWeight:600,fontSize:14,cursor:"pointer",background:"#f5f5f5",color:"#757575"}}>
                  Cancel
                </button>
                <button onClick={() => { if (deleteFrom || deleteTo) setDeleteConfirm(true); }}
                  disabled={!deleteFrom && !deleteTo}
                  style={{flex:1,border:"none",borderRadius:10,padding:"13px",fontWeight:700,fontSize:14,cursor:(deleteFrom||deleteTo)?"pointer":"not-allowed",background:(deleteFrom||deleteTo)?"#ffebee":"#f5f5f5",color:(deleteFrom||deleteTo)?"#c62828":"#bbb"}}>
                  Delete
                </button>
              </>
            ) : (
              <>
                <button onClick={() => setDeleteConfirm(false)}
                  style={{flex:1,border:"none",borderRadius:10,padding:"13px",fontWeight:600,fontSize:14,cursor:"pointer",background:"#f5f5f5",color:"#757575"}}>
                  Go Back
                </button>
                <button onClick={deleteEntriesByDate}
                  style={{flex:1,border:"none",borderRadius:10,padding:"13px",fontWeight:800,fontSize:14,cursor:"pointer",background:"#c62828",color:"#fff"}}>
                  Confirm Delete
                </button>
              </>
            )}
          </div>
        )}
      </Modal>

      {/* ── ENCRYPTED BACKUP & RESTORE MODAL ── */}
      <Modal open={showBackup} onClose={() => { setShowBackup(false); setBackupErr(""); }} title="Encrypted Backup & Restore">
        <div style={{fontSize:12,fontWeight:700,color:"#757575",textTransform:"uppercase",letterSpacing:"0.06em",marginBottom:8}}>
          Export Encrypted Backup
        </div>
        <span style={{...lbl, marginTop:4}}>Encryption Password (Optional)</span>
        <input type="password" value={backupPassword} onChange={e => setBackupPassword(e.target.value)} placeholder="Enter password to protect backup" style={inp}/>

        <button onClick={exportEncryptedBackup}
          style={{width:"100%",border:"none",borderRadius:10,padding:"14px",fontWeight:800,fontSize:15,cursor:"pointer",background:NAVY,color:"#fff",marginTop:10,marginBottom:6}}>
          🔒 Download Encrypted Backup
        </button>
        <p style={{fontSize:11,color:"#888",marginBottom:20}}>Uses AES-GCM 256-bit encryption with PBKDF2 key derivation.</p>

        <div style={{height:1,background:"#e5e7eb",marginBottom:20}}/>

        <div style={{fontSize:12,fontWeight:700,color:"#757575",textTransform:"uppercase",letterSpacing:"0.06em",marginBottom:8}}>
          Restore Backup
        </div>
        <button onClick={() => {
          if (window.AndroidBridge && window.AndroidBridge.openFilePicker) {
            window.AndroidBridge.openFilePicker();
          } else {
            fileInputRef.current?.click();
          }
        }} style={{width:"100%",border:"2px dashed #ccc",borderRadius:10,padding:"14px",fontWeight:700,fontSize:15,cursor:"pointer",background:"#f9f9f9",color:"#444",marginBottom:8}}>
          📂 Choose Backup File
        </button>
        <input ref={fileInputRef} type="file" accept=".json" onChange={handleFileImport} style={{display:"none"}}/>

        {backupErr && <div style={{background:"#ffebee",color:"#c62828",borderRadius:8,padding:"10px 14px",fontSize:13,marginTop:8}}>⚠ {backupErr}</div>}
        {backupOk && <div style={{background:GREEN_LIGHT,color:GREEN,borderRadius:8,padding:"10px 14px",fontSize:13,fontWeight:700,marginTop:8}}>✓ {backupSuccessMsg}</div>}

        <button onClick={() => { setShowBackup(false); setBackupErr(""); }}
          style={{width:"100%",border:"none",borderRadius:10,padding:"13px",fontWeight:700,fontSize:14,cursor:"pointer",background:"#f5f5f5",color:"#757575",marginTop:12}}>
          Close
        </button>
      </Modal>

      {/* ── PASSWORD PROMPT FOR DECRYPTION ── */}
      <Modal open={showPasswordPrompt} onClose={() => { setShowPasswordPrompt(false); setPendingEncryptedPayload(null); }} title="Backup is Encrypted" center>
        <p style={{fontSize:13,color:"#555",marginBottom:12}}>
          This backup file is encrypted with a password. Please enter the password to decrypt and restore your data.
        </p>
        <input type="password" value={restorePassword} onChange={e => setRestorePassword(e.target.value)}
          placeholder="Enter backup password" style={inp} autoFocus/>
        {backupErr && <div style={{fontSize:11,color:"#c62828",marginTop:6,fontWeight:600}}>{backupErr}</div>}
        <div style={{display:"flex",gap:8,marginTop:16}}>
          <button onClick={() => { setShowPasswordPrompt(false); setPendingEncryptedPayload(null); }}
            style={{flex:1,border:"none",borderRadius:10,padding:"12px",fontWeight:600,fontSize:14,background:"#f5f5f5",color:"#757575",cursor:"pointer"}}>
            Cancel
          </button>
          <button onClick={submitDecryptionPassword}
            style={{flex:1,border:"none",borderRadius:10,padding:"12px",fontWeight:800,fontSize:14,background:NAVY,color:"#fff",cursor:"pointer"}}>
            Decrypt & Restore
          </button>
        </div>
      </Modal>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
</html>
