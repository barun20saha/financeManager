<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"/>
<title>My Accounts</title>

<!-- PWA Meta Tags -->
<meta name="mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"/>
<meta name="apple-mobile-web-app-title" content="My Accounts"/>
<meta name="theme-color" content="#0D7C59"/>

<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
<script>
  const _warn = console.warn;
  console.warn = (...args) => {
    if (args[0] && typeof args[0] === 'string' && args[0].includes('Babel')) return;
    _warn.apply(console, args);
  };
</script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.2/babel.min.js"></script>
<style>
  :root {
    --bg-dark: #1A1A1A;
    --bg-card: #242424;
    --text-primary: #E8E8E8;
    --text-secondary: #A0A0A0;
    --forest-green: #0D7C59;
    --teal: #16A085;
    --success: #09C574;
    --warning: #FF9800;
    --error: #E74C3C;
    --border: #303030;
    --heatmap-0: #2A2A2A;
    --heatmap-1: #1E5D4B;
    --heatmap-2: #16A085;
    --heatmap-3: #0D7C59;
    --heatmap-4: #09C574;
  }

  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
  body{
    background: var(--bg-dark);
    font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
    color: var(--text-primary);
    overscroll-behavior:none;
    height: 100vh;
    overflow: hidden;
  }
  input,textarea,button{font-family:inherit;}
  ::-webkit-scrollbar{width:0;}

  .safe-top { padding-top: env(safe-area-inset-top, 0px); }
  .safe-bottom { padding-bottom: env(safe-area-inset-bottom, 0px); }

  .btn-pill {
    border-radius: 20px;
    padding: 10px 20px;
    border: none;
    font-weight: 700;
    cursor: pointer;
    transition: all 0.2s;
  }

  .card {
    background: var(--bg-card);
    border-radius: 8px;
    border: 1px solid var(--border);
    padding: 16px;
    margin-bottom: 12px;
  }

  .toggle-switch {
    width: 50px;
    height: 28px;
    background: #404040;
    border-radius: 14px;
    position: relative;
    cursor: pointer;
    transition: background 0.3s;
  }
  .toggle-switch.on { background: var(--teal); }
  .toggle-switch::after {
    content: '';
    position: absolute;
    width: 24px;
    height: 24px;
    background: white;
    border-radius: 50%;
    top: 2px;
    left: 2px;
    transition: left 0.3s;
  }
  .toggle-switch.on::after { left: 24px; }
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const {useState,useCallback,useRef,useEffect,useMemo}=React;

// ── helpers ───────────────────────────────────────────────────
const uid=()=>Math.random().toString(36).slice(2)+Date.now();
const todayStr=()=>new Date().toISOString().split("T")[0];
const fmtAmt=n=>"₹"+Math.abs(n).toLocaleString("en-IN",{minimumFractionDigits:0,maximumFractionDigits:2});
const fmtDate=d=>new Date(d+"T00:00:00").toLocaleDateString("en-IN",{day:"numeric",month:"short",year:"numeric"});
const initials=n=>n.trim().split(" ").map(w=>w[0]).join("").slice(0,2).toUpperCase();

// ── DB ────────────────────────────────────────────────────────
const INIT={
  customers:[],
  suppliers:[],
  transactions:{},
  trips:[],
  logs:[],
  settings: {
    appLockEnabled: false,
    pin: null,
    biometricsEnabled: false
  }
};
const DB_KEY="myaccounts_pro_v1";

function persistData(data){
  try{localStorage.setItem(DB_KEY,JSON.stringify(data));}catch(e){}
}

function loadDB(){
  try{
    const d=JSON.parse(localStorage.getItem(DB_KEY)||"null");
    if(d && d.customers) return {...INIT, ...d};
  }catch(e){}
  return INIT;
}

// ── Components ────────────────────────────────────────────────

function Modal({open,onClose,title,children,center=false}){
  if(!open)return null;
  return(
    <div onClick={e=>e.target===e.currentTarget&&onClose()}
      style={{position:"fixed",inset:0,background:"rgba(0,0,0,0.8)",zIndex:1000,display:"flex",alignItems:center?"center":"flex-end",justifyContent:"center", padding: center ? 20 : 0}}>
      <div
        style={{background:"#242424",borderRadius:center?"12px":"20px 20px 0 0",width:"100%",maxWidth:480,
          padding:"20px",maxHeight:"90vh",overflowY:"auto", border: '1px solid #303030'}}>
        {!center && <div style={{width:40,height:4,background:"#404040",borderRadius:2,margin:"0 auto 16px"}}/>}
        {title && <h3 style={{marginBottom:16,fontSize:20,fontWeight:700, color: '#E8E8E8', textAlign: center ? 'center' : 'left'}}>{title}</h3>}
        {children}
      </div>
    </div>
  );
}

// ── Components ────────────────────────────────────────────────

function Heatmap({transactions}) {
  const today = new Date();
  const days = [];
  for (let i = 364; i >= 0; i--) {
    const d = new Date();
    d.setDate(today.getDate() - i);
    days.push(d.toISOString().split('T')[0]);
  }

  const counts = useMemo(() => {
    const map = {};
    Object.values(transactions).flat().forEach(tx => {
      map[tx.date] = (map[tx.date] || 0) + 1;
    });
    return map;
  }, [transactions]);

  const getColor = (count) => {
    if (!count) return 'var(--heatmap-0)';
    if (count < 2) return 'var(--heatmap-1)';
    if (count < 4) return 'var(--heatmap-2)';
    if (count < 6) return 'var(--heatmap-3)';
    return 'var(--heatmap-4)';
  };

  return (
    <div className="card" style={{overflowX: 'auto', padding: '12px'}}>
      <div style={{display:'flex', gap: 3, width: 'max-content'}}>
        {Array.from({length: 53}).map((_, weekIdx) => (
          <div key={weekIdx} style={{display:'flex', flexDirection:'column', gap: 3}}>
            {Array.from({length: 7}).map((_, dayIdx) => {
              const dateIdx = weekIdx * 7 + dayIdx;
              const date = days[dateIdx];
              const count = counts[date] || 0;
              return (
                <div
                  key={dayIdx}
                  title={`${date}: ${count} transactions`}
                  style={{width: 10, height: 10, borderRadius: 2, background: getColor(count)}}
                />
              );
            })}
          </div>
        ))}
      </div>
      <div style={{display:'flex', justifyContent:'space-between', marginTop: 8, fontSize: 10, color: 'var(--text-secondary)'}}>
        <span>Less</span>
        <div style={{display:'flex', gap: 3}}>
          {[0,1,2,3,4].map(v => <div key={v} style={{width:10, height:10, borderRadius:2, background: `var(--heatmap-${v})`}}/>)}
        </div>
        <span>More</span>
      </div>
    </div>
  );
}

function LedgerView({db, save}) {
  const [activeTab, setActiveTab] = useState('customers'); // customers, suppliers
  const [openId, setOpenId] = useState(null);
  const entities = db[activeTab] || [];

  const stats = useMemo(() => {
    let get = 0, give = 0;
    entities.forEach(e => {
      const txs = db.transactions[e.id] || [];
      const balance = txs.reduce((s, t) => {
        const p = t.amount - (t.settlements || []).reduce((ss, sx) => ss + sx.amount, 0);
        return t.type === 'debit' ? s + p : s - p;
      }, 0);
      if (activeTab === 'customers') {
        if (balance > 0) get += balance; else give += Math.abs(balance);
      } else {
        if (balance < 0) get += Math.abs(balance); else give += balance;
      }
    });
    return {get, give};
  }, [db, activeTab]);

  if (openId) {
    return <div style={{padding: 20}}>
      <button className="btn-pill" onClick={() => setOpenId(null)} style={{background: 'var(--border)', color: 'white', marginBottom: 20}}>← Back</button>
      <h2>Detail for {entities.find(e => e.id === openId)?.name}</h2>
      {/* Detail view implementation would go here, reusing logic from previous version but with new styles */}
    </div>;
  }

  return (
    <div style={{padding: 16}}>
      <div style={{display:'flex', justifyContent:'space-between', alignItems:'center', marginBottom: 16}}>
        <h2 style={{fontSize: 24, fontWeight: 800}}>Ledger</h2>
        <div style={{display:'flex', background: 'var(--bg-card)', borderRadius: 12, padding: 4}}>
          {['customers', 'suppliers'].map(t => (
            <div key={t} onClick={() => setActiveTab(t)}
              style={{padding: '6px 12px', borderRadius: 8, fontSize: 12, fontWeight: 700, cursor: 'pointer',
                background: activeTab === t ? 'var(--forest-green)' : 'transparent',
                color: activeTab === t ? 'white' : 'var(--text-secondary)'}}>
              {t.charAt(0).toUpperCase() + t.slice(1)}
            </div>
          ))}
        </div>
      </div>

      <div style={{display:'grid', gridTemplateColumns:'1fr 1fr', gap: 12, marginBottom: 20}}>
        <div className="card" style={{marginBottom: 0, borderLeft: '4px solid var(--success)'}}>
          <div style={{fontSize: 10, color: 'var(--text-secondary)', textTransform:'uppercase', marginBottom: 4}}>You Get</div>
          <div style={{fontSize: 20, fontWeight: 800, color: 'var(--success)'}}>{fmtAmt(stats.get)}</div>
        </div>
        <div className="card" style={{marginBottom: 0, borderLeft: '4px solid var(--error)'}}>
          <div style={{fontSize: 10, color: 'var(--text-secondary)', textTransform:'uppercase', marginBottom: 4}}>You Give</div>
          <div style={{fontSize: 20, fontWeight: 800, color: 'var(--error)'}}>{fmtAmt(stats.give)}</div>
        </div>
      </div>

      <Heatmap transactions={db.transactions} />

      <div style={{marginTop: 20}}>
        {entities.map(e => (
          <div key={e.id} className="card" onClick={() => setOpenId(e.id)} style={{display:'flex', justifyContent:'space-between', alignItems:'center', cursor:'pointer'}}>
            <div style={{display:'flex', alignItems:'center', gap: 12}}>
              <div style={{width:40, height:40, borderRadius:8, background: 'var(--forest-green)', display:'flex', alignItems:'center', justifyContent:'center', fontWeight:800}}>
                {initials(e.name)}
              </div>
              <div style={{fontWeight: 600}}>{e.name}</div>
            </div>
            <div style={{textAlign:'right'}}>
              <div style={{fontWeight: 700, color: 'var(--success)'}}>₹0</div>
              <div style={{fontSize: 10, color: 'var(--text-secondary)'}}>Settled</div>
            </div>
          </div>
        ))}
      </div>
    </div>
  );
}

function TripsView({db, save}) {
  const [showAdd, setShowAdd] = useState(false);
  const [name, setName] = useState("");
  const [activeTripId, setActiveTripId] = useState(null);

  const trips = db.trips || [];
  const activeTrip = trips.find(t => t.id === activeTripId);

  const createTrip = () => {
    if (!name.trim()) return;
    const newTrip = {
      id: uid(),
      name: name.trim(),
      createdAt: Date.now(),
      participants: ["Me"], // Default participant
      expenses: []
    };
    save({...db, trips: [...trips, newTrip]});
    setName("");
    setShowAdd(false);
  };

  if (activeTripId && activeTrip) {
    return (
      <div style={{padding: 16}}>
        <button className="btn-pill" onClick={() => setActiveTripId(null)} style={{background: 'var(--border)', color: 'white', marginBottom: 20}}>← Back</button>
        <h2 style={{fontSize: 24, fontWeight: 800, marginBottom: 8}}>{activeTrip.name}</h2>
        <div style={{fontSize: 12, color: 'var(--text-secondary)', marginBottom: 20}}>
          {activeTrip.participants.length} Participants • {activeTrip.expenses.length} Expenses
        </div>

        <button className="btn-pill" style={{width:'100%', background:'var(--teal)', color:'white', marginBottom: 20}}>+ Add Expense</button>

        {activeTrip.expenses.length === 0 ? (
          <div style={{textAlign:'center', padding: 40, color: 'var(--text-secondary)'}}>No expenses yet.</div>
        ) : (
          activeTrip.expenses.map(ex => (
            <div key={ex.id} className="card" style={{display:'flex', justifyContent:'space-between'}}>
               <div>
                 <div style={{fontWeight: 600}}>{ex.description}</div>
                 <div style={{fontSize: 12, color: 'var(--text-secondary)'}}>Paid by {ex.paidBy}</div>
               </div>
               <div style={{fontWeight: 700, color: 'var(--success)'}}>{fmtAmt(ex.amount)}</div>
            </div>
          ))
        )}
      </div>
    );
  }

  return (
    <div style={{padding: 16}}>
      <div style={{display:'flex', justifyContent:'space-between', alignItems:'center', marginBottom: 20}}>
        <h2 style={{fontSize: 24, fontWeight: 800}}>Trips</h2>
        <button onClick={() => setShowAdd(true)} className="btn-pill" style={{background: 'var(--teal)', color: 'white', fontSize: 12}}>+ New Trip</button>
      </div>

      {trips.length === 0 ? (
        <div style={{textAlign:'center', padding: 60, color: 'var(--text-secondary)'}}>
          <div style={{fontSize: 48, marginBottom: 16}}>🌍</div>
          <p>Plan your trips and split expenses easily.</p>
        </div>
      ) : (
        trips.map(t => (
          <div key={t.id} className="card" onClick={() => setActiveTripId(t.id)} style={{cursor:'pointer'}}>
            <div style={{fontSize: 18, fontWeight: 700, marginBottom: 4}}>{t.name}</div>
            <div style={{fontSize: 12, color: 'var(--text-secondary)'}}>
              {t.expenses.length} expenses • {fmtDate(new Date(t.createdAt).toISOString().split('T')[0])}
            </div>
          </div>
        ))
      )}

      <Modal open={showAdd} onClose={() => setShowAdd(false)} title="Create New Trip" center>
        <div style={{fontSize: 12, color: 'var(--text-secondary)', textTransform:'uppercase', fontWeight: 700, marginBottom: 8}}>Trip Name</div>
        <input
          value={name}
          onChange={e => setName(e.target.value)}
          placeholder="e.g. Goa 2024"
          style={{width:'100%', background:'var(--bg-dark)', border:'1px solid var(--border)', borderRadius: 8, padding: 12, color: 'white', marginBottom: 20, outline: 'none'}}
        />
        <button onClick={createTrip} className="btn-pill" style={{width:'100%', background:'var(--forest-green)', color:'white'}}>Create Trip</button>
      </Modal>
    </div>
  );
}

// ── Crypto Utilities ──────────────────────────────────────────
const encryptData = async (data, password) => {
  const encoder = new TextEncoder();
  const keyMaterial = await crypto.subtle.importKey("raw", encoder.encode(password), "PBKDF2", false, ["deriveKey"]);
  const salt = crypto.getRandomValues(new Uint8Array(16));
  const key = await crypto.subtle.deriveKey(
    { name: "PBKDF2", salt, iterations: 100000, hash: "SHA-256" },
    keyMaterial,
    { name: "AES-GCM", length: 256 },
    false,
    ["encrypt"]
  );
  const iv = crypto.getRandomValues(new Uint8Array(12));
  const encrypted = await crypto.subtle.encrypt({ name: "AES-GCM", iv }, key, encoder.encode(JSON.stringify(data)));
  return JSON.stringify({
    salt: Array.from(salt),
    iv: Array.from(iv),
    data: Array.from(new Uint8Array(encrypted))
  });
};

const decryptData = async (encryptedStr, password) => {
  const { salt, iv, data } = JSON.parse(encryptedStr);
  const encoder = new TextEncoder();
  const keyMaterial = await crypto.subtle.importKey("raw", encoder.encode(password), "PBKDF2", false, ["deriveKey"]);
  const key = await crypto.subtle.deriveKey(
    { name: "PBKDF2", salt: new Uint8Array(salt), iterations: 100000, hash: "SHA-256" },
    keyMaterial,
    { name: "AES-GCM", length: 256 },
    false,
    ["decrypt"]
  );
  const decrypted = await crypto.subtle.decrypt(
    { name: "AES-GCM", iv: new Uint8Array(iv) },
    key,
    new Uint8Array(data)
  );
  return JSON.parse(new TextDecoder().decode(decrypted));
};

// ── Sections ──────────────────────────────────────────────────

function SecurityView({db, save}) {
  const settings = db.settings || INIT.settings;

  const toggleAppLock = () => {
    save({...db, settings: {...settings, appLockEnabled: !settings.appLockEnabled}});
  };

  const toggleBiometrics = () => {
    if (window.AndroidBridge && window.AndroidBridge.authenticateBiometric) {
        // Test biometric before enabling
        window.onBiometricResult = (success, msg) => {
            if (success) {
                save({...db, settings: {...settings, biometricsEnabled: !settings.biometricsEnabled}});
            } else {
                alert("Biometric verification failed: " + msg);
            }
        };
        window.AndroidBridge.authenticateBiometric();
    } else {
        alert("Biometrics not supported on this device/browser.");
    }
  };

  return (
    <div style={{padding: 16}}>
      <h2 style={{fontSize: 24, fontWeight: 800, color: 'var(--forest-green)', marginBottom: 20}}>Security</h2>

      <div className="card">
        <div style={{display:'flex', justifyContent:'space-between', alignItems:'center'}}>
          <div>
            <div style={{fontWeight: 700}}>App Lock</div>
            <div style={{fontSize: 12, color: 'var(--text-secondary)'}}>Require PIN or Fingerprint to open</div>
          </div>
          <div
            className={`toggle-switch ${settings.appLockEnabled ? 'on' : ''}`}
            onClick={toggleAppLock}
          />
        </div>
      </div>

      <div className="card">
        <div style={{display:'flex', justifyContent:'space-between', alignItems:'center'}}>
          <div>
            <div style={{fontWeight: 700}}>Fingerprint / Face ID</div>
            <div style={{fontSize: 12, color: 'var(--text-secondary)'}}>Use biometrics to unlock</div>
          </div>
          <div
            className={`toggle-switch ${settings.biometricsEnabled ? 'on' : ''}`}
            onClick={toggleBiometrics}
          />
        </div>
      </div>

      <div style={{marginTop: 32}}>
        <h3 style={{fontSize: 18, fontWeight: 700, marginBottom: 12}}>Backup & Restore</h3>
        <div style={{display:'grid', gridTemplateColumns:'1fr 1fr', gap: 12}}>
            <div className="card" style={{textAlign:'center', padding: 20, cursor:'pointer'}} onClick={() => {/* Backup logic */}}>
                <div style={{fontSize: 24, marginBottom: 8}}>🔒</div>
                <div style={{fontWeight: 700, fontSize: 14}}>Encrypted Backup</div>
            </div>
            <div className="card" style={{textAlign:'center', padding: 20, cursor:'pointer'}} onClick={() => {/* Export logic */}}>
                <div style={{fontSize: 24, marginBottom: 8}}>📤</div>
                <div style={{fontWeight: 700, fontSize: 14}}>Export Data</div>
            </div>
        </div>
      </div>
    </div>
  );
}

function LogsView({db, save}) {
  const logs = db.logs || [];
  const [filter, setFilter] = useState("All");

  const filteredLogs = logs.filter(l => filter === "All" || l.type === filter);

  const filters = ["All", "Login", "Backup", "PIN Changes", "Biometrics", "Transactions"];

  return (
    <div style={{padding: 16}}>
      <h2 style={{fontSize: 24, fontWeight: 800, marginBottom: 16}}>Transaction Logs</h2>

      <div style={{display:'flex', gap: 8, overflowX: 'auto', paddingBottom: 16, marginBottom: 8}}>
        {filters.map(f => (
          <button
            key={f}
            onClick={() => setFilter(f)}
            className="btn-pill"
            style={{
                background: filter === f ? 'var(--forest-green)' : '#404040',
                color: 'white',
                fontSize: 12,
                whiteSpace: 'nowrap',
                padding: '8px 16px'
            }}
          >
            {f}
          </button>
        ))}
      </div>

      {filteredLogs.length === 0 ? (
        <div style={{textAlign:'center', padding: 60, color: 'var(--text-secondary)'}}>No logs found.</div>
      ) : (
        filteredLogs.map(l => (
          <div key={l.id} className="card" style={{display:'flex', alignItems:'center', gap: 12, padding: 12}}>
            <div style={{width: 6, height: 6, borderRadius: '50%', background: l.status === 'success' ? 'var(--success)' : 'var(--error)'}} />
            <div style={{flex: 1}}>
              <div style={{fontWeight: 700, fontSize: 14}}>{l.type} {l.status === 'success' ? 'Successful' : 'Failed'}</div>
              <div style={{fontSize: 11, color: 'var(--text-secondary)'}}>
                {new Date(l.timestamp).toLocaleString()} • {l.device}
              </div>
            </div>
            <div style={{fontSize: 16}}>{l.type === 'Backup' ? '☁️' : l.type === 'Login' ? '🔑' : '📝'}</div>
          </div>
        ))
      )}
    </div>
  );
}

// ── Main App ──────────────────────────────────────────────────

function App(){
  const[db,setDB]=useState(loadDB);
  const[tab,setTab]=useState('ledger'); // ledger, trips, security, logs

  const save = (next) => {
    setDB(next);
    persistData(next);
  };

  const logAction = (type, detail, status = 'success') => {
    const newLog = {
      id: uid(),
      type,
      detail,
      status,
      timestamp: Date.now(),
      device: "Android Device"
    };
    save({...db, logs: [newLog, ...(db.logs || [])]});
  };

  return(
    <div style={{height:'100vh', display:'flex', flexDirection:'column', background: 'var(--bg-dark)'}}>
      <div style={{flex:1, overflowY:'auto'}}>
        {tab === 'ledger' && <LedgerView db={db} save={save} />}
        {tab === 'trips' && <TripsView db={db} save={save} />}
        {tab === 'security' && <SecurityView db={db} save={save} />}
        {tab === 'logs' && <LogsView db={db} save={save} />}
      </div>

      {/* Bottom Nav */}
      <div className="safe-bottom" style={{background:'#242424', borderTop:'1px solid #303030', display:'flex', justifyContent:'space-around', padding:'10px 0'}}>
        {[
          {id:'ledger', label:'Ledger', icon:'📒'},
          {id:'trips', label:'Trips', icon:'✈️'},
          {id:'security', label:'Security', icon:'🔒'},
          {id:'logs', label:'Logs', icon:'📋'}
        ].map(t => (
          <div key={t.id} onClick={() => setTab(t.id)} style={{textAlign:'center', opacity: tab === t.id ? 1 : 0.5, cursor:'pointer'}}>
            <div style={{fontSize:20}}>{t.icon}</div>
            <div style={{fontSize:10, fontWeight: 700, marginTop: 4, color: tab === t.id ? 'var(--teal)' : '#A0A0A0'}}>{t.label}</div>
          </div>
        ))}
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
